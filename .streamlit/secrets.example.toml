# Copiez ce fichier vers .streamlit/secrets.toml en local ou dans
# Settings > Secrets sur Streamlit Community Cloud.
# Ne versionnez jamais le fichier contenant les valeurs réelles.

# Variables optionnelles, exposées comme variables d'environnement.
# Nécessaires uniquement pour les fonctionnalités correspondantes.
OPENAI_API_KEY = "REMPLACER_PAR_LA_CLE_OPENAI"
FRANCE_TRAVAIL_CLIENT_ID = "REMPLACER_PAR_LE_CLIENT_ID_FRANCE_TRAVAIL"
FRANCE_TRAVAIL_CLIENT_SECRET = "REMPLACER_PAR_LE_SECRET_FRANCE_TRAVAIL"

[auth]
# Community Cloud : https://VOTRE-APP.streamlit.app/oauth2callback
# Local : http://localhost:8501/oauth2callback
redirect_uri = "https://VOTRE-APP.streamlit.app/oauth2callback"
cookie_secret = "REMPLACER_PAR_UN_SECRET_ALEATOIRE"
client_id = "REMPLACER_PAR_LE_CLIENT_ID_GOOGLE"
client_secret = "REMPLACER_PAR_LE_CLIENT_SECRET_GOOGLE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
allowed_emails = [
    "utilisateur-autorise@example.com"
]
